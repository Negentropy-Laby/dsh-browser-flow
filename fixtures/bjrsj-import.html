<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>Browser Flow local import fixture</title>
<style>body{font-family:sans-serif;padding:20px}.el-table{margin:10px;border:1px solid #aaa}td,th{padding:4px}.el-upload__input{display:none}</style>
<button type="button" id="unit">单位信息变更</button>
<div class="el-tabs__item is-active" role="tab" id="business"></div>
<div class="el-upload"><button type="button"><span>上传申报信息</span></button><input class="el-upload__input" type="file" accept=".xlsx"></div>
<button type="button" id="submit">提交</button>
<div id="tables"></div><div id="message"></div>
<script>
const options=new URLSearchParams(location.search);const kind=options.get('kind')||'add';const mode=options.get('mode')||'success';const transport=options.get('transport')||'xhr';
const labels={add:'批量增员',modify:'批量修改',reduce:'批量减员'};document.querySelector('#business').textContent=labels[mode==='wrong-tab'?'modify':kind];
window.fixture={inputEvents:0,changeEvents:0,submitClicks:0};
document.querySelector('#submit').onclick=()=>fixture.submitClicks++;
document.querySelector('#unit').onclick=()=>fetch('/zhrs/api4/ggfw-server-yltc/unitSearch/queryUnitInfo',{method:'POST',body:'{}'}).then(response=>response.json());
const person={name:'测试甲',certificateNumber:'110101199001010011'};
function table(rejected,rows){return '<div class="el-table"'+(rejected?' style="display:none"':'')+'><div class="el-table__header"><table><tr><th>姓名</th><th>证件号码</th><th>'+(rejected?'失败原因':'电子劳动合同')+'</th></tr></table></div><div class="el-table__body-wrapper"><table><tbody>'+rows.map(p=>'<tr><td>'+p.name+'</td><td>'+p.certificateNumber+'</td><td>'+(rejected?'测试拒绝':'')+'</td></tr>').join('')+'</tbody></table></div>'+(!rows.length?'<div class="el-table__empty-block">暂无数据</div>':'')+'</div>'}
function render(){document.querySelector('#tables').innerHTML=table(false,mode==='row-failure'?[]:[person])+table(true,mode==='row-failure'?[person]:[])}
render();
if(mode==='old-summary')document.querySelector('#message').innerHTML='<div class="el-message">导入有1条记录，成功1条，失败0条</div>';
function result(){if(mode!=='stale-tables')render();if(mode!=='old-summary')document.querySelector('#message').innerHTML='<div class="el-message">导入有1条记录，成功'+(mode==='row-failure'?0:1)+'条，失败'+(mode==='row-failure'?1:0)+'条</div>'}
const file=document.querySelector('input[type=file]');file.addEventListener('input',()=>fixture.inputEvents++);
file.addEventListener('change',async()=>{fixture.changeEvents++;const bytes=await file.files[0].arrayBuffer();const path='/zhrs/api4/ggfw-server-yltc/CommonBusiness/'+(kind==='modify'?'ThreeInOneModifyExcelCheck':'ThreeInOneExcelCheck');
  const send=()=>{if(transport==='fetch')return fetch(path,{method:'POST',body:bytes}).then(response=>response.text()).then(result);const xhr=new XMLHttpRequest();xhr.open('POST',path);xhr.addEventListener('load',result);xhr.send(bytes);};
  send();if(mode==='double-request')send();
});
</script></html>
